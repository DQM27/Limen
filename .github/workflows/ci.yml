name: CI

on:
  push:
    branches: [main]
  # Cualquier PR, también los apilados sobre otra rama.
  pull_request:

# Permisos mínimos para todo el workflow; un trabajo que necesite más los
# pide él mismo.
permissions:
  contents: read

# Una subida nueva al mismo PR cancela la corrida anterior. En `main` no se
# cancela nada: cada commit tiene que quedar verificado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # El cascarón de Tauri (`limen-escritorio`) necesita el frontend ya
  # compilado y, en Linux, las bibliotecas de WebKitGTK: lo verifica sólo el
  # trabajo `escritorio`, en Windows (donde corren los equipos de la
  # portería). Los demás trabajos lo excluyen.
  SIN_CASCARON: --workspace --exclude limen-escritorio

jobs:
  formato:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Instala la versión fijada en rust-toolchain.toml (la misma que en
      # cada máquina), no "la última estable".
      - name: Rust del proyecto
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets $SIN_CASCARON -- -D warnings
        shell: bash

  # En Linux y en Windows: los equipos de la portería son Windows, y varias
  # pruebas (bloqueo de archivos, rutas) se comportan distinto en cada uno.
  pruebas:
    name: Pruebas (${{ matrix.so }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked $SIN_CASCARON
        shell: bash

  documentacion:
    name: Documentación (rustdoc sin avisos)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --locked --no-deps $SIN_CASCARON
        shell: bash

  # Vulnerabilidades conocidas en las dependencias. Los avisos que no se
  # pueden arreglar desde aquí están justificados en `.cargo/audit.toml`.
  auditoria:
    name: Vulnerabilidades en dependencias (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # La app de escritorio: el frontend (Angular) y el cascarón de Tauri, que
  # incrusta el frontend compilado. En Windows, como los equipos reales.
  escritorio:
    name: App de escritorio (Angular + Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/escritorio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Formato (prettier)
        run: npx prettier --check "src/**/*.{ts,html,scss}"
      - name: Pruebas (vitest)
        run: npx ng test --no-watch
      - name: Compilar el frontend
        run: npm run build
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy del cascarón
        run: cargo clippy --locked --all-targets -p limen-escritorio -- -D warnings

  # Un solo resultado para exigir en la protección de `main`: si mañana se
  # agrega o renombra un trabajo, la protección no hay que tocarla.
  verificado:
    name: CI verde
    if: always()
    needs: [formato, clippy, pruebas, documentacion, auditoria, escritorio]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los trabajos pasaron
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case " $RESULTADOS " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
