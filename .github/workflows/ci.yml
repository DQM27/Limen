name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Instala la versión fijada en rust-toolchain.toml (la misma que en
      # cada máquina), no "la última estable".
      - name: Rust del proyecto
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --all
