name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Revisión de dependencias nuevas del PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Complementa a Dependabot (que avisa después, en su corrida semanal):
      # corre en cada PR y bloquea el merge si el diff agrega una dependencia
      # con una vulnerabilidad ya conocida.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          # Avisos permitidos, cada uno con su motivo. Se revisan en cada
          # subida de la dependencia que los trae; si ya no aparecen, se
          # borran de aquí.
          #
          # GHSA-wrw7-89jp-8q8g (RUSTSEC-2024-0429): `glib` 0.18, unsoundness
          # en `VariantStrIter`. Lo trae Tauri sólo en Linux (GTK 3 vía wry);
          # en Windows, donde corren los equipos, Tauri usa WebView2 y `glib`
          # no se compila. Tauri 2 no tiene versión con `glib` corregido.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
