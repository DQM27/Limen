[package]
name = "limen-escritorio-comandos"
description = "Lógica de los comandos de la app de escritorio: JSON de entrada y salida y errores para la interfaz, sin Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Adaptador de entrada: recibe la `Aplicacion` ya armada por `composicion`.
# No depende de Tauri ni de SurrealDB; el cascarón de Tauri sólo registra
# estos comandos. La prueba `tests/arquitectura.rs` vigila esta lista.
[dependencies]
limen-aplicacion.workspace = true
limen-composicion.workspace = true
limen-dominio.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
limen-infra-memoria.workspace = true
tokio.workspace = true

[lints]
workspace = true
