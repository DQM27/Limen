<form (submit)="$event.preventDefault(); guardar()" novalidate>
  <div class="cabecera">
    <h2 mat-dialog-title>{{ titulo }}</h2>
    <button mat-icon-button type="button" class="cerrar" aria-label="Cerrar" (click)="cancelar()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Nombre de la empresa</mat-label>
      <input
        matInput
        [formControl]="nombre"
        autocomplete="off"
        (input)="escribir($event)"
        aria-describedby="ayuda-empresa"
      />
      @if (nombre.errors?.['nucleo']; as mensaje) {
        <mat-error>{{ mensaje }}</mat-error>
      }
    </mat-form-field>
    <p class="ayuda" id="ayuda-empresa">
      Revisa que no exista ya con otro nombre parecido: una empresa creada no se borra.
    </p>
    <p class="error" role="alert">{{ errorGeneral() }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="enviando()">Crear empresa</button>
  </mat-dialog-actions>
</form>
