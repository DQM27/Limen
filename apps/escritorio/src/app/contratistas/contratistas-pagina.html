<!-- El título no se ve (la barra lateral ya dice dónde está la persona) pero
     queda para los lectores de pantalla. -->
<h1 class="solo-lectores">Contratistas</h1>

@if (error(); as mensaje) {
  <p class="error" role="alert">{{ mensaje }}</p>
}

<app-tabla
  id="contratistas"
  etiqueta="Contratistas"
  marcador="Cédula, nombre, empresa…"
  [columnas]="columnas"
  [filas]="filas()"
  [cargando]="cargando()"
  [idFila]="idFila"
  (filaDobleClic)="abrirFormulario($event)"
  [reglas]="reglas"
>
  <button
    acciones
    mat-flat-button
    type="button"
    class="ingreso"
    appAtajo="F2"
    matTooltip="Registrar ingreso (F2)"
    (click)="registrarIngreso()"
  >
    <mat-icon aria-hidden="true">login</mat-icon>
    Registrar ingreso
  </button>
  <button
    acciones
    mat-stroked-button
    type="button"
    class="nuevo"
    appAtajo="Ctrl+N"
    matTooltip="Nuevo contratista (Ctrl+N)"
    (click)="abrirFormulario()"
  >
    <mat-icon aria-hidden="true">add</mat-icon>
    Nuevo contratista
  </button>
</app-tabla>
