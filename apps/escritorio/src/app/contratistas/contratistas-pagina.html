<!-- El título no se ve (la barra lateral ya dice dónde está la persona) pero
     queda para los lectores de pantalla. -->
<h1 class="solo-lectores">Contratistas</h1>

@if (error(); as mensaje) {
  <p class="error" role="alert">{{ mensaje }}</p>
}

<app-tabla
  id="contratistas"
  etiqueta="Contratistas"
  marcador="Cédula, nombre, empresa…"
  [columnas]="columnas"
  [filas]="filas()"
  [cargando]="cargando()"
  [idFila]="idFila"
  (filaDobleClic)="abrirFormulario($event)"
>
  <button acciones mat-flat-button type="button" class="nuevo" (click)="abrirFormulario()">
    <mat-icon aria-hidden="true">add</mat-icon>
    Nuevo contratista
  </button>
</app-tabla>
