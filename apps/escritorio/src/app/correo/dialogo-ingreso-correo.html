<form (submit)="$event.preventDefault(); registrar()" novalidate>
  <div class="cabecera">
    <h2 mat-dialog-title>Registrar ingreso por correo</h2>
    <button mat-icon-button type="button" class="cerrar" aria-label="Cerrar" (click)="cancelar()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="campos">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Cédula</mat-label>
        <input matInput inputmode="numeric" autocomplete="off" [formControl]="cedula" />
        @if (cedula.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          autocomplete="off"
          [formControl]="nombre"
          (input)="escribirNombre($event)"
        />
        @if (nombre.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Motivo de la visita</mat-label>
        <textarea matInput rows="2" autocomplete="off" [formControl]="motivo"></textarea>
        @if (motivo.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <app-campos-de-ingreso
        etiquetaGafete="Número de gafete de visita"
        [medio]="medio"
        [placa]="placa"
        [gafete]="gafete"
      />
    </div>

    <p class="error" role="alert">{{ errorGeneral() }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="enviando()">Registrar ingreso</button>
  </mat-dialog-actions>
</form>
