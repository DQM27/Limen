<form (submit)="$event.preventDefault(); guardar()" novalidate>
  <div class="cabecera">
    <h2 mat-dialog-title>Nuevos gafetes</h2>
    <button mat-icon-button type="button" class="cerrar" aria-label="Cerrar" (click)="cancelar()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <p class="tipo">
      Tipo: <strong>{{ etiquetaTipo }}</strong>
    </p>

    <div class="campos">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Desde el número</mat-label>
        <input
          matInput
          inputmode="numeric"
          autocomplete="off"
          [formControl]="desde"
          (input)="escribir(desde, $event)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Hasta el número</mat-label>
        <input
          matInput
          inputmode="numeric"
          autocomplete="off"
          aria-describedby="ayuda-hasta"
          [formControl]="hasta"
          (input)="escribir(hasta, $event)"
        />
        @if (hasta.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>
    </div>
    <p class="ayuda" id="ayuda-hasta">Para crear uno solo, deja «Hasta» vacío.</p>
    <p class="error" role="alert">{{ errorGeneral() }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="enviando()">Crear</button>
  </mat-dialog-actions>
</form>
