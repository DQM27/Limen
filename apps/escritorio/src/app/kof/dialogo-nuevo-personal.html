<form (submit)="$event.preventDefault(); registrar()" novalidate>
  <div class="cabecera">
    <h2 mat-dialog-title>Nuevo personal KOF</h2>
    <button mat-icon-button type="button" class="cerrar" aria-label="Cerrar" (click)="cancelar()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="campos">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Código de empleado</mat-label>
        <input
          matInput
          inputmode="numeric"
          autocomplete="off"
          [formControl]="codigo"
          (input)="escribirCodigo($event)"
        />
        @if (codigo.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          autocomplete="off"
          [formControl]="nombre"
          (input)="escribirNombre($event)"
        />
        @if (nombre.errors?.['nucleo']; as mensaje) {
          <mat-error>{{ mensaje }}</mat-error>
        }
      </mat-form-field>
    </div>

    <p class="error" role="alert">{{ errorGeneral() }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="enviando()">Registrar</button>
  </mat-dialog-actions>
</form>
