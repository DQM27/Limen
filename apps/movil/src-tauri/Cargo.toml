[package]
name = "limen-movil"
description = "Cascarón de Tauri de la app móvil de Limen (Android): la misma interfaz y los mismos comandos que el escritorio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "limen_movil_lib"
# `cdylib` es lo que carga Android.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Sin esto la app busca un servidor de desarrollo en vez de usar la interfaz
# que lleva dentro. `tauri android build` la activa solo; con `cargo ndk` hay
# que pedirla.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
limen-composicion.workspace = true
limen-escritorio-comandos.workspace = true
limen-infra-plataforma.workspace = true
limen-infra-surreal.workspace = true
tauri.workspace = true
tauri-plugin-log.workspace = true
# Sólo para abrir la semilla (copia de la base de pruebas) la primera vez.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Sin los lints del espacio de trabajo: el macro `mobile_entry_point` de Tauri
# genera código `unsafe`, que el resto del proyecto prohíbe.
