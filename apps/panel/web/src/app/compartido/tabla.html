<section class="tabla" role="region" [attr.aria-label]="etiqueta()">
  <div class="herramientas">
    <div class="grupo">
      <ng-content select="[controles]" />
      @if (camposDeBusqueda()) {
        <div class="buscador">
          <mat-icon aria-hidden="true">search</mat-icon>
          <input
            type="search"
            autocomplete="off"
            [placeholder]="marcador()"
            [attr.aria-label]="'Buscar en ' + etiqueta()"
            [value]="buscado()"
            (input)="escribir($event)"
          />
        </div>
      }
    </div>
    <div class="grupo">
      <ng-content select="[acciones]" />
      <p class="conteo" role="status" aria-live="polite">{{ conteo() }}</p>
    </div>
  </div>

  <div class="rejilla">
    <ag-grid-angular
      [theme]="tema"
      [columnDefs]="columnas()"
      [defaultColDef]="columnaPorDefecto"
      [rowData]="filas()"
      [getRowId]="obtenerIdFila()"
      [context]="contexto"
      [isExternalFilterPresent]="hayBusqueda"
      [doesExternalFilterPass]="pasaLaBusqueda"
      [localeText]="textos"
      [loading]="cargando()"
      [overlayNoRowsTemplate]="mensajeVacio()"
      [rowHeight]="36"
      [headerHeight]="38"
      [accentedSort]="true"
      [enableCellTextSelection]="true"
      tooltipShowMode="whenTruncated"
      [tooltipShowDelay]="400"
      (gridReady)="alIniciar($event)"
      (modelUpdated)="alActualizarFilas($event)"
    />
  </div>
</section>
