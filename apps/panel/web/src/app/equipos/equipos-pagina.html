<h1 class="solo-lectores">Equipos</h1>

@if (error(); as mensaje) {
  <p class="error" role="alert">{{ mensaje }}</p>
}

<app-tabla
  etiqueta="Equipos"
  [columnas]="columnas()"
  [filas]="filas()"
  [cargando]="cargando()"
  [idFila]="idFila"
  mensajeVacio="Todavía no hay equipos registrados."
>
  <button controles mat-flat-button type="button" (click)="registrar()">
    <mat-icon aria-hidden="true">add</mat-icon>
    Nuevo equipo
  </button>
</app-tabla>
