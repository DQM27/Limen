<div class="cabecera">
  <h2 mat-dialog-title>Clave temporal</h2>
</div>
<mat-dialog-content>
  <p class="ayuda">
    Cédula <strong>{{ datos.cedula }}</strong> · {{ datos.nombre }}
  </p>
  <div class="clave" role="status">
    <span class="texto">{{ datos.clave }}</span>
    <button mat-stroked-button type="button" (click)="copiar()">
      <mat-icon aria-hidden="true">{{ copiada() ? 'check' : 'content_copy' }}</mat-icon>
      {{ copiada() ? 'Copiada' : 'Copiar' }}
    </button>
  </div>
  <p class="ayuda">
    Se muestra una sola vez: no se vuelve a ver después de cerrar esta ventana. Envíesela a la
    persona (WhatsApp, en persona…); la tendrá que cambiar al iniciar sesión.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button type="button" (click)="cerrar()">Ya la copié</button>
</mat-dialog-actions>
