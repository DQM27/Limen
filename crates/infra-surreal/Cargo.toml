[package]
name = "limen-infra-surreal"
description = "Adaptador de SurrealDB embebido para los puertos de Limen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
limen-dominio.workspace = true
limen-aplicacion.workspace = true
chrono.workspace = true
surrealdb.workspace = true
uuid.workspace = true
# Para avisar a la sincronización con la nube cada vez que se confirma algo.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
limen-infra-memoria.workspace = true
limen-pruebas-contrato.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
