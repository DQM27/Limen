[package]
name = "limen-importador-lattis"
description = "Herramienta de desarrollo: carga en Limen un volcado SQL de Lattis, aplicando las reglas del dominio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "limen_importador_lattis"

[[bin]]
name = "importar-lattis"
path = "src/main.rs"

# Herramienta de las capas externas (como `composicion`): lee el volcado,
# lo traduce con los constructores del dominio y lo guarda por los puertos de
# `aplicacion`. Sólo el binario conoce la base real. Los datos reales de
# Lattis nunca viven en este repositorio: las pruebas usan datos inventados.
[dependencies]
limen-aplicacion.workspace = true
limen-dominio.workspace = true
limen-infra-plataforma.workspace = true
limen-infra-surreal.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
limen-composicion.workspace = true
limen-infra-memoria.workspace = true

[lints]
workspace = true
